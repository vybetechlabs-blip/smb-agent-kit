name: CI

# Every push to main, pull request and manual run: the full matrix,
# Ubuntu 3.11/3.12/3.13 + Windows 3.12, then a generator smoke test against this checkout.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.11" }
          - { os: ubuntu-latest, python: "3.12" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: windows-latest, python: "3.12" }
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --python ${{ matrix.python }}

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Tests
        run: uv run pytest

      - name: Generator smoke (generate, install, lint, test)
        shell: bash
        run: |
          uv run python scripts/new_project.py demo-agent --dest "$RUNNER_TEMP/gen" --kit-path "$GITHUB_WORKSPACE"
          cd "$RUNNER_TEMP/gen/demo-agent"
          uv sync --python ${{ matrix.python }}
          uv run ruff check .
          uv run ruff format --check .
          uv run pytest
          uv run demo-agent list
