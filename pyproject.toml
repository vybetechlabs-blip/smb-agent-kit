[project]
name = "smb-agent-kit"
version = "0.1.0"
description = "Shared parts for approval-gated agents: approval queue, idempotent sending, LLM providers, eval runs, config"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
    "typer>=0.26.8",
]

[project.optional-dependencies]
llm = [
    "anthropic>=0.116.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["smb_agent_kit"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["templates"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# The report helpers build long Markdown table rows; splitting them hurts reading.
"smb_agent_kit/evals/report.py" = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# typer declares CLI options as argument defaults by design.
extend-immutable-calls = ["typer.Option", "typer.Argument", "pathlib.Path"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.21",
]
